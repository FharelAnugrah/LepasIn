<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 88" width="280" height="88" role="img" aria-label="Logo LepasIn">
  <defs>
    <linearGradient id="lepasinNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4375" />
      <stop offset="100%" stop-color="#0F294A" />
    </linearGradient>
    <linearGradient id="lepasinCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F8FC" />
    </linearGradient>
  </defs>

  <!-- 3D Plinth Shadow Layer -->
  <rect x="4" y="9" width="272" height="74" rx="20" fill="#B3C5DB" />

  <!-- Studio Daylight Card Surface (Kontras Terjamin di Light & Dark Mode) -->
  <rect x="4" y="4" width="272" height="74" rx="20" fill="url(#lepasinCardGrad)" stroke="#CBD7E6" stroke-width="1.5" />

  <!-- Emblem 3D Deep Campus Navy -->
  <rect x="20" y="20" width="46" height="46" rx="13" fill="#07172C" />
  <rect x="20" y="17" width="46" height="46" rx="13" fill="url(#lepasinNavyGrad)" stroke="#245591" stroke-width="1" />

  <!-- Monogram Geometris 'L' + Aksen Campus Gold -->
  <path
    d="M34 29v20h17"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="5.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <rect x="46" y="26" width="9" height="9" rx="2.8" fill="#B87D04" />
  <rect x="46" y="24.5" width="9" height="9" rx="2.8" fill="#FBBF24" />

  <!-- Wordmark LepasIn + Campus Gold Dot -->
  <text
    x="80"
    y="52"
    font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="36"
    font-weight="800"
    letter-spacing="-1.1"
    fill="#0F294A"
  >LepasIn<tspan dx="1" fill="#FBBF24">.</tspan></text>
</svg>
